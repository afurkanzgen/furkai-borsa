services:
  - type: web
    name: furkai-bist
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server_wsgi.py"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FURKAI_USER
        sync: false
      - key: FURKAI_PASSWORD
        sync: false
      - key: FURKAI_REQUIRE_AUTH
        value: "1"
      - key: FURKAI_SECRET_KEY
        sync: false
